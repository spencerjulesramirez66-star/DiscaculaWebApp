{% load i18n %}
<header class="site-header">
  <div class="container site-header__inner">
    <a class="site-header__brand" href="{% url 'core:home' %}">{{ SITE_NAME }}</a>
    <nav aria-label="{% translate 'Account' %}">
      {% if user.is_authenticated %}
        <span class="site-header__user">{{ user.display_name }}</span>
        <form method="post" action="{% url 'accounts:logout' %}" class="inline">
          {% csrf_token %}
          <button type="submit" class="btn btn--ghost">{% translate "Log out" %}</button>
        </form>
      {% else %}
        <a class="btn btn--ghost" href="{% url 'accounts:login' %}">{% translate "Log in" %}</a>
        <a class="btn" href="{% url 'accounts:signup' %}">{% translate "Sign up" %}</a>
      {% endif %}
    </nav>
  </div>
</header>
