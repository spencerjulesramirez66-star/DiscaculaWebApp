[project]
name = "webapp-dyscalculia"
version = "0.1.0"
requires-python = ">=3.14"

[tool.ruff]
line-length = 100
target-version = "py314"
extend-exclude = ["**/migrations/*.py"]

[tool.ruff.lint]
# E/F: pycodestyle + pyflakes, I: import sorting, B: bugbear, UP: pyupgrade,
# DJ: Django-specific checks, SIM: simplifications
select = ["E", "F", "I", "B", "UP", "DJ", "SIM"]

[tool.ruff.lint.isort]
known-first-party = ["apps", "config"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings.test"
python_files = ["test_*.py"]
addopts = "-q"

[tool.mypy]
# Django ships without type stubs; silence editor noise until django-stubs is worth adding.
ignore_missing_imports = true
