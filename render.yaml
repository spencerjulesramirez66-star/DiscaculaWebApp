# Render "Blueprint": New → Blueprint → pick this repo. Details: docs/14-hosting.md
services:
  - type: web
    name: dyscalculia-app
    runtime: python
    plan: free
    buildCommand: bash build.sh
    startCommand: gunicorn config.wsgi:application
    envVars:
      - key: PYTHON_VERSION
        value: 3.14.6
      - key: DJANGO_SETTINGS_MODULE
        value: config.settings.prod
      - key: SECRET_KEY
        generateValue: true
      - key: DEBUG
        value: "False"
      # SQLite on the free disk: simple, but reset on every restart/deploy (LOAD_DEMO refills it).
      # For data that lasts, create a Render PostgreSQL database and paste its URL here instead.
      - key: DATABASE_URL
        value: sqlite:///db.sqlite3
      - key: LOAD_DEMO
        value: "True"
      # Email (fill these in Render → Environment when ready; until then codes go to the log)
      - key: EMAIL_BACKEND
        value: django.core.mail.backends.console.EmailBackend
      - key: EMAIL_HOST
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      - key: DEFAULT_FROM_EMAIL
        sync: false
